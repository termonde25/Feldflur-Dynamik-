plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // Jadex Grundlagen (Blatt 3)
    implementation 'org.activecomponents.jadex:common:5.0-beta16'
    implementation 'org.activecomponents.jadex:collection:5.0-beta16'
    implementation 'org.activecomponents.jadex:classreader:5.0-beta16'
    implementation 'org.activecomponents.jadex:future:5.0-beta16'
    implementation 'org.activecomponents.jadex:core:5.0-beta16'
    implementation 'org.activecomponents.jadex:execution:5.0-beta16'
    implementation 'org.activecomponents.jadex:injection:5.0-beta16'
    implementation 'org.activecomponents.jadex:result:5.0-beta16'
    implementation 'org.activecomponents.jadex:logbase:5.0-beta16'
    implementation 'org.activecomponents.jadex:providedservice:5.0-beta16'
    implementation 'org.activecomponents.jadex:requiredservice:5.0-beta16'
    implementation 'org.activecomponents.jadex:libmicro:5.0-beta16'

    // BDI (Blatt 5)
    implementation 'org.activecomponents.jadex:bdi:5.0-beta16'

    // libGDX (Blatt 6)
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'feldflur.Start'
    // macOS: libGDX muss im ersten Thread laufen
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}